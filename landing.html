            theme: {

                    colors: { 
                        gold: '#C5A059', 
                        dark: '#050505', 
                        surface: '#111111',

                    animation: {
                        'fade-in-up': 'fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {

    <style>
        body { background-color: #050505; color: #ffffff; }
        
        /* Glassmorphism premium */
        .glass-panel {
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);

        .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #AA771C 100%); }
        .gold-text-gradient { 
            background: linear-gradient(135deg, #E6C875 0%, #C5A059 50%, #906A20 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        /* Botón con brillo dinámico */
        .btn-shine {
            position: relative; overflow: hidden;
        }
        .btn-shine::after {
            content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%;
            background: rgba(255,255,255,0.3); transform: rotate(30deg); transition: 0.5s;
        }
        .btn-shine:hover::after { left: 120%; transition: 0.7s ease-in-out; }

        /* Estilos de Inputs para Dark Mode */
        input:focus, textarea:focus, select:focus {
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.15);
            border-color: #C5A059 !important;
            background-color: rgba(255, 255, 255, 0.08) !important;
            outline: none;
        }
        
        /* Select dropdown dark styling */
        select option {
            background-color: #111111;
            color: #ffffff;
        }
        select optgroup {
            background-color: #0a0a0a;
            color: #C5A059;
            font-weight: 700;
        }

        .start-transparent { opacity: 0; }

        /* Lienzo de Partículas de Fondo */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
    </style>

                        <optgroup label="Academia (Cursos IA)">

                            <option value="Curso: IA para Peritajes" data-plan="ia_peritajes">Curso: IA para Peritajes</option>
                            <option value="Curso: IA Administrativos" data-plan="ia_administrativos">Curso: IA Administrativos</option>

                        He leído y acepto el <button type="button" onclick="openPrivacyModal()" class="text-gold font-bold underline decoration-gold/30 underline-offset-2 hover:text-white transition-colors">Aviso de Privacidad Integral</button> y los <button type="button" onclick="openTermsModal()" class="text-gold font-bold underline decoration-gold/30 underline-offset-2 hover:text-white transition-colors">Términos y Condiciones</button>.
                    </label>

                <button type="submit" class="btn-shine w-full bg-white text-black font-black px-8 py-5 rounded-xl uppercase text-xs tracking-[0.2em] shadow-[0_0_30px_rgba(255,255,255,0.15)] hover:bg-gold hover:shadow-gold/20 hover:scale-[1.02] transition-all flex justify-center items-center gap-3 mt-8">
                    Enviar Solicitud <i data-lucide="arrow-right" class="w-4 h-4"></i>

                <p class="text-center text-[9px] text-gray-500 mt-6 uppercase tracking-widest">Tus datos están encriptados y protegidos bajo nuestras políticas vigentes.</p>

    <footer class="bg-black/60 backdrop-blur-md py-16 px-6 border-t border-white/10 text-gray-500 text-sm mt-auto relative z-10 w-full">

            <div class="flex items-center gap-4">
                <img src="pixel&code-logo-landing.png" alt="Logo" class="w-8 h-8 rounded-full grayscale opacity-50 hover:grayscale-0 hover:opacity-100 transition-all" onerror="this.src='https://placehold.co/100x100/111/C5A059?text=DU'">
                <span class="tracking-[0.2em] text-[10px] uppercase font-bold text-gray-400">© 2026 DU Pixel & Code</span>

            <div class="flex gap-8 text-[10px] uppercase tracking-widest font-bold">

                <a href="mailto:info@dupixelcode.com" class="hover:text-white transition-colors">Email</a>
                <button type="button" onclick="openPrivacyModal()" class="hover:text-white transition-colors">Privacidad</button>
                <button type="button" onclick="openTermsModal()" class="hover:text-white transition-colors">Términos</button>
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();
        
        // --- SISTEMA DE PARTÍCULAS / NODOS DE FONDO ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        let mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (distance < mouse.radius) {
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                }

                this.baseX += this.directionX;
                this.baseY += this.directionY;

                if(this.baseX < 0 || this.baseX > canvas.width) this.directionX = -this.directionX;
                if(this.baseY < 0 || this.baseY > canvas.height) this.directionY = -this.directionY;

                this.draw();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 12000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * .4) - .2;
                let directionY = (Math.random() * .4) - .2;
                let color = 'rgba(197, 160, 89, 0.4)'; 
                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                    + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    if (distance < (canvas.width / 10) * (canvas.height / 10)) {
                        let opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = 'rgba(255, 255, 255, ' + (opacityValue * 0.15) + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            requestAnimationFrame(animateParticles);
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connectParticles();
        }

        initParticles();
        animateParticles();

        // --- LÓGICA DE AUTO-SELECCIÓN EXACTA (Protegida de colisiones) ---
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const plan = urlParams.get('plan');
            const select = document.getElementById('plan-select');
            
            if(plan) {
                const planLower = plan.toLowerCase();
                Array.from(select.options).forEach(option => {
                    if(option.dataset.plan === planLower) {
                        option.selected = true;
                    }
                });
            }
        });
    </script>
